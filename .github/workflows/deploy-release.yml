name: deploy-release

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_ROOT: /home/u232419966/domains/ruangcerdas.id
      RELEASE_ID: ${{ github.run_id }}-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Create release folder
        run: |
          set -e
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            mkdir -p $APP_ROOT/releases/$RELEASE_ID
            mkdir -p $APP_ROOT/shared/storage/app/public
            mkdir -p $APP_ROOT/shared/bootstrap/cache
          "

      - name: Upload files to release
        run: |
          set -e
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='.env' \
            --exclude='public/rc-files/' \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_ROOT/releases/$RELEASE_ID/"

      - name: Verify Laravel release structure
        run: |
          set -e
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e

            echo 'Checking Laravel release structure...'

            test -f $APP_ROOT/releases/$RELEASE_ID/artisan
            test -f $APP_ROOT/releases/$RELEASE_ID/composer.json
            test -d $APP_ROOT/releases/$RELEASE_ID/app
            test -d $APP_ROOT/releases/$RELEASE_ID/routes
            test -d $APP_ROOT/releases/$RELEASE_ID/resources
            test -d $APP_ROOT/releases/$RELEASE_ID/public

            echo 'Laravel release structure OK'
          "

      - name: Verify new PPPK controller exists
        run: |
          set -e
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e

            echo 'Checking PppkTendikController.php...'

            test -f $APP_ROOT/releases/$RELEASE_ID/app/Http/Controllers/Public/PppkTendikController.php

            echo 'PppkTendikController.php exists in correct location'
          "

      - name: Install dependencies and prepare release
        run: |
          set -e
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e

            cd $APP_ROOT/releases/$RELEASE_ID

            if [ -f composer.json ]; then
              composer install --no-dev --optimize-autoloader --no-interaction
            fi

            rm -rf storage
            ln -sfn $APP_ROOT/shared/storage storage

            rm -rf public/storage
            ln -sfn $APP_ROOT/shared/storage/app/public public/storage

            if [ -f $APP_ROOT/shared/.env ]; then
              ln -sfn $APP_ROOT/shared/.env .env
            else
              echo 'ERROR: shared/.env not found'
              exit 1
            fi

            rm -rf bootstrap/cache
            ln -sfn $APP_ROOT/shared/bootstrap/cache bootstrap/cache

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          "

      - name: Activate release
        run: |
          set -e
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e

            ln -sfn $APP_ROOT/releases/$RELEASE_ID $APP_ROOT/current

            echo 'Release activated:'
            readlink -f $APP_ROOT/current
          "

      - name: Verify active release
        run: |
          set -e
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e

            echo 'Checking active current release...'

            test -f $APP_ROOT/current/artisan
            test -f $APP_ROOT/current/app/Http/Controllers/Public/PppkTendikController.php
            test -f $APP_ROOT/current/public/index.php

            echo 'Active release OK'
          "
