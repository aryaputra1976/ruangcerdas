name: deploy-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-release-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_ROOT: /home/u232419966/domains/ruangcerdas.id
      RELEASE_ID: ${{ github.run_id }}-${{ github.sha }}
      RUN_DB_SEED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build frontend assets
        run: |
          set -e
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          set -e
          mkdir -p "$HOME/.ssh"

          test -n "${{ secrets.SSH_HOST }}" || { echo "ERROR: SSH_HOST secret is empty."; exit 1; }
          test -n "${{ secrets.SSH_USER }}" || { echo "ERROR: SSH_USER secret is empty."; exit 1; }
          test -n "${{ secrets.SSH_PORT }}" || { echo "ERROR: SSH_PORT secret is empty."; exit 1; }
          test -n "${{ secrets.SSH_PRIVATE_KEY }}" || { echo "ERROR: SSH_PRIVATE_KEY secret is empty."; exit 1; }

          echo "Using SSH target ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }}"
          echo "For this server, GitHub Secrets should typically use the direct server IP/host and custom SSH port."

          if printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" | grep -q '\\n'; then
            echo "ERROR: SSH_PRIVATE_KEY appears to contain literal \\n sequences."
            echo "Store the key in GitHub Secrets with real line breaks, not escaped newlines."
            exit 1
          fi

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null 2>&1; then
            echo "ERROR: SSH_PRIVATE_KEY is not a valid OpenSSH private key or still requires a passphrase."
            echo "Use an unencrypted private key in OpenSSH format and ensure the matching public key is in authorized_keys."
            exit 1
          fi

          cat > "$HOME/.ssh/config" <<EOF
          Host deploy-server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile $HOME/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

          echo "SSH configuration prepared for ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }}"

      - name: Test SSH connection
        run: |
          ssh \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -F "$HOME/.ssh/config" \
            deploy-server "echo SSH OK"

      - name: Create release and shared folders
        run: |
          set -e

          ssh -F "$HOME/.ssh/config" deploy-server "
            set -e

            mkdir -p $APP_ROOT/releases/$RELEASE_ID

            mkdir -p $APP_ROOT/shared/storage/app/public
            mkdir -p $APP_ROOT/shared/storage/framework
            mkdir -p $APP_ROOT/shared/storage/framework/cache
            mkdir -p $APP_ROOT/shared/storage/framework/cache/data
            mkdir -p $APP_ROOT/shared/storage/framework/sessions
            mkdir -p $APP_ROOT/shared/storage/framework/views
            mkdir -p $APP_ROOT/shared/storage/logs

            mkdir -p $APP_ROOT/shared/bootstrap/cache

            chmod -R 775 $APP_ROOT/shared/storage
            chmod -R 775 $APP_ROOT/shared/bootstrap/cache
          "

      - name: Upload files to release
        run: |
          set -e

          rsync -az --delete \
            -e "ssh -F $HOME/.ssh/config" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='.env' \
            --exclude='public/rc-files/' \
            ./ \
            "deploy-server:$APP_ROOT/releases/$RELEASE_ID/"

      - name: Verify uploaded release
        run: |
          set -e

          ssh -F "$HOME/.ssh/config" deploy-server "
            set -e

            echo 'Checking Laravel release structure...'

            test -f $APP_ROOT/releases/$RELEASE_ID/artisan
            test -f $APP_ROOT/releases/$RELEASE_ID/composer.json
            test -d $APP_ROOT/releases/$RELEASE_ID/app
            test -d $APP_ROOT/releases/$RELEASE_ID/routes
            test -d $APP_ROOT/releases/$RELEASE_ID/resources
            test -d $APP_ROOT/releases/$RELEASE_ID/public

            echo 'Checking Vite manifest...'
            test -f $APP_ROOT/releases/$RELEASE_ID/public/build/manifest.json

            echo 'Uploaded release OK'
          "

      - name: Install dependencies and prepare release
        run: |
          set -e

          ssh -F "$HOME/.ssh/config" deploy-server "
            set -e

            cd $APP_ROOT/releases/$RELEASE_ID

            mkdir -p $APP_ROOT/shared/storage/app/public
            mkdir -p $APP_ROOT/shared/storage/framework
            mkdir -p $APP_ROOT/shared/storage/framework/cache
            mkdir -p $APP_ROOT/shared/storage/framework/cache/data
            mkdir -p $APP_ROOT/shared/storage/framework/sessions
            mkdir -p $APP_ROOT/shared/storage/framework/views
            mkdir -p $APP_ROOT/shared/storage/logs
            mkdir -p $APP_ROOT/shared/bootstrap/cache

            rm -rf storage
            ln -sfn $APP_ROOT/shared/storage storage

            rm -rf public/storage
            ln -sfn $APP_ROOT/shared/storage/app/public public/storage

            rm -rf bootstrap/cache
            ln -sfn $APP_ROOT/shared/bootstrap/cache bootstrap/cache

            chmod -R 775 $APP_ROOT/shared/storage
            chmod -R 775 $APP_ROOT/shared/bootstrap/cache

            if [ -f $APP_ROOT/shared/.env ]; then
              ln -sfn $APP_ROOT/shared/.env .env
            else
              echo 'ERROR: shared/.env not found'
              exit 1
            fi

            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            if [ \"$RUN_DB_SEED\" = \"true\" ]; then
              php artisan db:seed --force
            else
              echo 'Skipping db:seed in production deploy (RUN_DB_SEED=false).'
            fi
          "

      - name: Activate release
        run: |
          set -e

          ssh -F "$HOME/.ssh/config" deploy-server "
            set -e

            ln -sfn $APP_ROOT/releases/$RELEASE_ID $APP_ROOT/current

            echo 'Release activated:'
            readlink -f $APP_ROOT/current
          "

      - name: Verify active release
        run: |
          set -e

          ssh -F "$HOME/.ssh/config" deploy-server "
            set -e

            echo 'Checking active release...'

            test -f $APP_ROOT/current/artisan
            test -f $APP_ROOT/current/public/index.php
            test -f $APP_ROOT/current/public/build/manifest.json

            test -d $APP_ROOT/current/storage/framework/sessions
            test -d $APP_ROOT/current/storage/framework/views
            test -d $APP_ROOT/current/storage/framework/cache/data
            test -d $APP_ROOT/current/storage/logs

            echo 'Active release OK'
          "
